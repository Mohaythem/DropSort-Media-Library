[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dropsort-media-library"
version = "0.1.0"
description = "Local-first Windows media organizer and library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.11.1,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
]
package = [
  "pyinstaller>=6.21,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dropsort.ui" = [
  "assets/fonts/*.ttf",
  "assets/fonts/*.otf",
  "assets/fonts/*-OFL.txt",
  "assets/tmdb/*.svg",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["dropsort"]

[tool.coverage.report]
show_missing = true
skip_covered = true
